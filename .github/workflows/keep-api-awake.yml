# Render's free tier sleeps after 15 minutes without traffic, and the next request
# then waits ~30-60s for a cold start. Pinging the health check keeps it warm.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://gopratle-requirements-api-6s9f.onrender.com/api/health
