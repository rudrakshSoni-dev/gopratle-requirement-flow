# Render Blueprint for the API. In the Render dashboard: New → Blueprint → pick this repo.
services:
  - type: web
    name: gopratle-requirements-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: TypeScript is a devDependency and NODE_ENV=production would skip it.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
